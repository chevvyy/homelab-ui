apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab-ui
# bootstrap/ (namespaces + RBAC) is applied once by the cluster owner, not by this kustomization.
resources:
  - storage.yaml
  - certificates.yaml
  - tailscale-config.yaml
  - controller.yaml
  - lan-gateway.yaml
  - native-uis.yaml
images:
  - name: ghcr.io/chevvyy/homelab-ui
    newTag: "0.1.6"
